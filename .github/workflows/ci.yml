name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Run linter
        run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Typecheck
        run: python -c "import ast; [ast.parse(open(f).read()) for f in __import__('glob').glob('src/**/*.py', recursive=True)]"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q --no-header

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets in tracked files
        run: |
          git ls-files | grep -v -E '\.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|pdf)$' | while read f; do
            python -c "
import re, sys
patterns = [r'AKIA[0-9A-Z]{16}', r'gh[pousr]_[A-Za-z0-9]{36,}', r'glpat-[A-Za-z0-9_-]{20,}', r'xox[baprs]-[A-Za-z0-9-]{10,}', r'sk-[A-Za-z0-9]{20,}']
for p in patterns:
    if re.search(p, open(sys.argv[1], errors='ignore').read()):
        print(f'POTENTIAL SECRET in {sys.argv[1]}')
        sys.exit(1)
" \"\$f\" || exit 1
          done
          echo "No secrets found in tracked files"
      - name: Scan Python dependencies for vulnerabilities
        run: |
          pip install pip-audit || true
          pip-audit -r requirements.txt || true
      - name: Scan for exposed credentials
        run: |
          grep -rn -E '(ALPACA_API_KEY|ALPACA_SECRET_KEY|FEATHERLESS_API_KEY)\s*=\s*[^$]' --include='*.py' src/ | grep -v 'your_' | grep -v 'test-' | grep -v '_env(' | grep -v '_env_bool(' | grep -v '# ' || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Docker compose
        run: docker compose -f docker-compose.yml config
      - name: Build Docker image (lint-only)
        run: docker build -t sentinel:ci .
