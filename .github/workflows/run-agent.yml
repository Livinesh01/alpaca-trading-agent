name: Run trading agent

on:
  schedule:
    # 13:45, 16:30, 19:45 UTC ≈ 9:45am / 12:30pm / 3:45pm ET (adjust for DST manually)
    - cron: "45 13 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch: {}   # allows a manual "Run workflow" click for demos

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js (for Cline CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cline CLI
        run: npm install -g cline

      # CLINE_API_KEY must exist as a repository secret or `cline` cannot
      # authenticate, so the run dies at the cline invocation step with an
      # obscure error. Fail fast with setup instructions instead (matches
      # GitHub's "context access might be invalid" warning for secrets that are
      # not configured on the repo).
      - name: Authenticate Cline (non-interactive)
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
        run: |
          if [ -z "$CLINE_API_KEY" ]; then
            echo "::error::CLINE_API_KEY secret is not set."
            echo "Create it from your Cline provider/usage-billing settings, e.g.:"
            echo "  gh secret set CLINE_API_KEY -R ${{ github.repository }}"
            exit 1
          fi
          cline auth -p cline -k "$CLINE_API_KEY"

      # ALPACA_API_KEY / ALPACA_SECRET_KEY must exist as repository secrets or the
      # Cline/MCP session dies with an obscure auth error mid-run. Fail fast with
      # runnable setup instructions instead (matches GitHub's "context access might
      # be invalid" warning for secrets that are not configured on the repo).
      - name: Check Alpaca credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::ALPACA_API_KEY / ALPACA_SECRET_KEY are not set as repo secrets."
            echo "Add them at Settings > Secrets and variables > Actions, e.g.:"
            echo "  gh secret set ALPACA_API_KEY    -R ${{ github.repository }}"
            echo "  gh secret set ALPACA_SECRET_KEY -R ${{ github.repository }}"
            exit 1
          fi

      - name: Run agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          CLINE_RUN_TIMEOUT_SECONDS: "600"
          CLINE_MAX_RETRIES: "6"
        run: python src/orchestrator.py --force

      - name: Commit updated journal
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          git add journal/
          git diff --staged --quiet || git commit -m "Trading agent run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

