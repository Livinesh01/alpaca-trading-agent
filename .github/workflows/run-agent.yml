name: Run trading agent

on:
  schedule:
    # 13:45, 16:30, 19:45 UTC ≈ 9:45am / 12:30pm / 3:45pm ET (adjust for DST manually)
    - cron: "45 13 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch: {}   # allows a manual "Run workflow" click for demos

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The agent runs through orchestrator.py's DecisionLoop backend with a
      # Featherless/NVIDIA LLM provider — NOT the Cline CLI, so no CLINE_API_KEY
      # is needed. Since there is no .env file in CI, every credential and mode
      # flag below comes from GitHub secrets / this job's env.
      - name: Check LLM credentials
        env:
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$FEATHERLESS_API_KEY" ] && [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::No LLM provider key is set. The DecisionLoop backend requires FEATHERLESS_API_KEY or NVIDIA_API_KEY."
            echo "Add one as a repository secret, e.g.:"
            echo "  gh secret set FEATHERLESS_API_KEY -R ${{ github.repository }}"
            echo "  gh secret set NVIDIA_API_KEY     -R ${{ github.repository }}"
            exit 1
          fi

      # ALPACA_API_KEY / ALPACA_SECRET_KEY are consumed by the risk-guard proxy
      # that the DecisionLoop spawns. Fail fast with setup instructions when they
      # are not configured (matches GitHub's "context access might be invalid"
      # warning for secrets that are not configured on the repo).
      - name: Check Alpaca credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::ALPACA_API_KEY / ALPACA_SECRET_KEY are not set as repo secrets."
            echo "Add them at Settings > Secrets and variables > Actions, e.g.:"
            echo "  gh secret set ALPACA_API_KEY    -R ${{ github.repository }}"
            echo "  gh secret set ALPACA_SECRET_KEY -R ${{ github.repository }}"
            exit 1
          fi

      - name: Run agent
        env:
          AGENT_BACKEND: decision_loop
          PAPER_TRADING: "true"
          LLM_PROVIDER: featherless
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python src/orchestrator.py --force

      - name: Commit updated journal
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          git add journal/
          git diff --staged --quiet || git commit -m "Trading agent run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push