services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=sentinel
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinel_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build: .
    environment:
      - PAPER_TRADING=true
      - SENTINEL_ENVIRONMENT=development
      - SENTINEL_DATA_MODE=offline
      # Development-only auth mode — the only working non-production mode.
      # Production auth (OIDC/OAuth2) is explicitly unsupported until a real
      # identity provider is integrated; see src/api/auth.py.
      - API_AUTH_MODE=development
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
    volumes:
      - ./journal:/app/journal
    ports:
      - "8000:8000"   # FastAPI read-only API
      - "9108:9108"   # Prometheus metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The /health endpoint is public (no auth) so the container probe works
      # in both development and production without any credentials.
      test: ["CMD", "python", "-c",
             "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); assert r.status==200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: .
    command: ["python", "src/worker.py"]
    environment:
      - APP_ENV=development
      - PAPER_TRADING=true
      - ALPACA_PAPER=true
      - SENTINEL_DATA_MODE=proxy
      - LLM_PROVIDER=${LLM_PROVIDER:-featherless}
      - WORKER_INTERVAL_SECONDS=${WORKER_INTERVAL_SECONDS:-900}
      - DATABASE_URL=postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
    volumes:
      - ./journal:/app/journal
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"   # Prometheus Pushgateway (chaos suite pushes here)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      agent:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - grafana_admin_password
    security_opt:
      - no-new-privileges:true

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  pg_data:
