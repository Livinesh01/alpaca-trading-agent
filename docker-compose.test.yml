# PostgreSQL for repository integration tests (C6).
# Not used as a SQLite stand-in — these tests talk to real PostgreSQL SQL.
#
#   docker compose -f docker-compose.test.yml up -d
#   set TEST_DATABASE_URL=postgresql://sentinel:sentinel_test@127.0.0.1:55432/sentinel_test
#   python -m pytest tests/test_postgres_integration.py -q
#
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_test
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_test"]
      interval: 5s
      timeout: 5s
      retries: 10
